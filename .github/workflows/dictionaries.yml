name: Build and release dictionaries
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 18 * * *' # 03:17 JST, best-effort GitHub schedule
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified assets to GitHub Releases
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: dictionary-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      release_tag: ${{ steps.identity.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - run: rustup default 1.98.1
      - run: python3 -m unittest discover -s tests -v
      - run: cargo test --locked
      - name: Download latest source snapshots
        run: python3 jisyo.py fetch --update
      - name: Normalize with provenance
        run: python3 jisyo.py ingest
      - name: Fix release identity before generating documents
        id: identity
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: echo "tag=dict-${RUN_ID}-${RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Build all four profiles and source bundles
        env:
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/release.py --tag "$RELEASE_TAG" --repository "$RELEASE_REPOSITORY" --modifier "$RELEASE_REPOSITORY maintainers"
      - name: Rebuild from the corresponding source archive offline
        env:
          CARGO_HOME: ${{ runner.temp }}/dictionary-cargo
        run: |
          mkdir -p "$RUNNER_TEMP/dictionary-source"
          tar -xzf dist/release/dictionary-sources.tar.gz -C "$RUNNER_TEMP/dictionary-source"
          python3 "$RUNNER_TEMP/dictionary-source/scripts/verify_release.py" --directory "$RUNNER_TEMP/dictionary-source"
          python3 "$RUNNER_TEMP/dictionary-source/scripts/rebuild.py"
      - name: Check asset hashes
        working-directory: dist/release
        run: sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dictionaries
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  publish:
    needs: build
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.publish) ||
       (github.event_name == 'schedule' && vars.PUBLISH_DICTIONARIES == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dictionaries
          path: assets
      - name: Validate complete asset set
        working-directory: assets
        run: |
          sha256sum --check SHA256SUMS
          test -s migemo-compact-dict
          test -s SKK-JISYO.myhugejisyo.utf8
          test -s dictionary-sources.tar.gz
          test -s all-dictionaries.tar.gz
          test -s RELEASE_NOTES.md
          test -s RELEASE.json
      - name: Upload draft and publish only after all uploads succeed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --draft --target "$RELEASE_SHA" --title "$RELEASE_TAG" --notes-file assets/RELEASE_NOTES.md
          gh release upload "$RELEASE_TAG" assets/*
          gh release edit "$RELEASE_TAG" --draft=false --latest
